<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive JavaScript Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="content">
    <button id="actionButton">Click Me!</button>

    <div id="gallery">
      <img src="https://images.pexels.com/photos/546819/pexels-photo-546819.jpeg" alt="Programming Code" class="gallery-item">
      <img src="https://images.pexels.com/photos/1779487/pexels-photo-1779487.jpeg" alt="Computer Setup" class="gallery-item">
      <img src="https://images.pexels.com/photos/3861969/pexels-photo-3861969.jpeg" alt="Developer Working" class="gallery-item">
    </div>

    <form id="formData">
      <input type="text" id="nameInput" placeholder="Enter your name" required>
      <input type="email" id="emailInput" placeholder="Enter your email" required>
      <input type="password" id="passwordInput" placeholder="Enter password" required>
      <button type="submit">Submit</button>
    </form>

    <div id="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
